name: Frontend images (prototype)

on:
  push:
    branches: [custom-frontend-image]
    paths: [frontend-image/**, .github/workflows/frontend-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: 19-formblock
            description: volto-form-block
            packages: volto-form-block@3.20.0
            addons: volto-form-block
            theme: ""
          - tag: 19-vlt
            description: Volto Light Theme
            packages: "@kitconcept/volto-light-theme@8.1.4"
            addons: "@kitconcept/volto-light-theme"
            theme: "@kitconcept/volto-light-theme"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend-image
          platforms: linux/amd64
          push: true
          build-args: |
            PACKAGES=${{ matrix.packages }}
            ADDONS=${{ matrix.addons }}
            THEME=${{ matrix.theme }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/plone-in-a-box-frontend:${{ matrix.tag }}
            ghcr.io/${{ github.repository_owner }}/plone-in-a-box-frontend:${{ matrix.tag }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=plone/plone-frontend 19 with ${{ matrix.description }}
