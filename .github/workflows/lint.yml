name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck src/StackScript

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, digitalocean]
    defaults:
      run:
        working-directory: src/${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -diff
      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Template is up to date with src/StackScript
        run: python3 scripts/build-cloudformation.py --check
      - name: cfn-lint
        run: |
          pip install cfn-lint
          cfn-lint src/aws/cloudformation.yaml
