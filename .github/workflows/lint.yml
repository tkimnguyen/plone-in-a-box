name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck src/StackScript src/user-data.sh scripts/test-deploy.sh
      - name: Launchers download the same release
        run: |
          release=$(sed -n "s/^PIAB_RELEASE='\(.*\)'$/\1/p" src/user-data.sh)
          template=$(grep -A3 '^  Release:' src/aws/cloudformation.yaml | sed -n 's/.*Default: "\(.*\)"/\1/p')
          echo "src/user-data.sh: $release, src/aws/cloudformation.yaml: $template"
          test -n "$release" && test "$template" = "$release"
          bad=$(grep -Hno 'plone-in-a-box/[^/ ]*/src/StackScript' README.md docs/setup-guide.md \
            | grep -v "plone-in-a-box/$release/src/StackScript" || true)
          if [ -n "$bad" ]; then echo "Launchers in the docs download another release:"; echo "$bad"; exit 1; fi

      - name: The script fits in the Terraform user data
        run: |
          # src/*/main.tf embed src/StackScript compressed. EC2 allows 16384 bytes
          # (sent without comment lines), Hetzner 32768 (as base64); leave room for
          # the settings.
          aws=$(grep -vE '^[[:space:]]*#[^!]' src/StackScript | gzip -9 | wc -c)
          hetzner=$(gzip -9 < src/StackScript | base64 -w0 | wc -c)
          echo "AWS: $aws of 15000 bytes, Hetzner: $hetzner of 30000 bytes"
          test "$aws" -lt 15000 && test "$hetzner" -lt 30000

  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, digitalocean, hetzner]
    defaults:
      run:
        working-directory: src/${{ matrix.provider }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt
        run: terraform fmt -check -diff
      - name: terraform validate
        run: |
          terraform init -backend=false
          terraform validate

  cloudformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: cfn-lint
        run: |
          pip install cfn-lint
          cfn-lint src/aws/cloudformation.yaml
